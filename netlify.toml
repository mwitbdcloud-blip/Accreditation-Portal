[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES"

# Redirect API calls to the live Cloud backend proxy
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-zqosip4jfkfqe52ceyf7yn-139025000629.asia-southeast1.run.app/api/:splat"
  status = 200
  force = false

# Single Page Application fallback for Netlify and GitHub deployments
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
