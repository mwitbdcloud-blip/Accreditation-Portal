<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#000000"/>
  <!-- Square Monogram Frame -->
  <rect x="145" y="30" width="110" height="110" fill="none" stroke="#ffffff" stroke-width="7"/>
  <!-- Monogram Interlaced Chevron Lines -->
  <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="square">
    <line x1="158" y1="44" x2="179" y2="126"/>
    <line x1="179" y1="44" x2="200" y2="126"/>
    <line x1="200" y1="44" x2="221" y2="126"/>
    <line x1="221" y1="44" x2="242" y2="126"/>

    <line x1="179" y1="44" x2="158" y2="126"/>
    <line x1="200" y1="44" x2="179" y2="126"/>
    <line x1="221" y1="44" x2="200" y2="126"/>
    <line x1="242" y1="44" x2="221" y2="126"/>
  </g>
  <!-- Text: MEGAWORLD INTERNATIONAL -->
  <text x="200" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" letter-spacing="9">MEGAWORLD</text>
  <text x="200" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="12">INTERNATIONAL</text>
</svg>
